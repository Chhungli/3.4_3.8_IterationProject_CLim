	if($_SERVER["REQUEST_METHOD"] == "POST") {

		//connect.php (tells where to connect servername, dbasename, username, password)
		require "MP3Filelister_mysqli.php";

		//username and password sent form
		$myusername = mysqli_real_escape_string($conn, $_POST['username']);
		$mypassword = mysqli_real_escape_string($conn, $_POST['password']);

		$query = "SELECT User_ID
				  FROM user
				  WHERE User_ID = '$myusername'
				  AND Password = '$mypassword'";

		$result = mysqli_query($conn,$query);

		$count = mysqli_num_rows($result);

		if($count == 1) {

			$_SESSION['login_user'] = $myusername;

			// Check if the user is "Graeme"
			if(strtolower($myusername) == "graeme") {
				header("location:admin.php");
				exit();
			}
			else {
				header("location:page2.php");
				exit();
			}
		}
		else {
			$error = "Error Invalid username or password";
		}
	}

	ob_end_flush();

			function togglePassword() {
				var field = document.getElementById("passwordField");
				var label = document.querySelector(".toggle-password");
				if (field.type === "password") {
					field.type = "text";
					label.textContent = "Hide";
				} else {
					field.type = "password";
					label.textContent = "Show";
